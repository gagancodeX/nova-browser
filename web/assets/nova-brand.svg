<path d="M345 564C473 504 633 469 808 417C1005 359 1160 285 1202 239C1237 201 1210 184 1153 198C1101 211 1053 235 1008 253" fill="none" stroke="#6a46ff" stroke-width="23" opacity=".32" filter="url(#glow)"/>
