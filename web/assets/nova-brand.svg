<path d="M345 564C473 504 633 469 808 417C1005 359 1160 285 1202 239C1237 201 1210 184 1153 198C1101 211 1053 235 1008 253" fill="none" stroke="#f3e5ff" stroke-width="2.5" opacity=".7"/>
<path d="M1135 304v38M1116 323h38" stroke="#e9fbff" stroke-width="4" filter="url(#glow)"/>
<!-- Crown -->
<path d="M679 98L733 151Q757 175 779 150L766 70L792 30L817 71L802 151Q823 174 850 150L900 99L873 185Q846 206 768 207Q690 206 663 185Z" fill="url(#crown)" filter="url(#soft)"/>
<path d="M699 191Q768 216 837 191L833 210Q768 236 703 210Z" fill="#9e5dff"/>
<path d="M701 190Q768 214 835 190" fill="none" stroke="#fff" stroke-width="4" opacity=".85"/>
<!-- Pointer mark -->
<path d="M827 411L970 489L914 504L931 543L907 555L886 516L854 554Z" fill="#080d32" stroke="#090b35" stroke-width="18" stroke-linejoin="round"/>
<path d="M827 411L970 489L914 504L931 543L907 555L886 516L854 554Z" fill="#fff" stroke="#e3efff" stroke-width="5" stroke-linejoin="round" filter="url(#soft)"/>
<!-- Clouds -->
<path d="M0 635C28 625 37 595 71 594C92 544 142 559 161 592C200 585 213 621 229 653C272 667 279 722 312 752V1024H0Z" fill="url(#cloud)" opacity=".72"/>
<path d="M0 725C47 694 68 735 100 714C137 682 177 710 180 753C221 775 210 809 264 836V1024H0Z" fill="#210b68" opacity=".52"/>
<path d="M1536 650C1495 622 1474 597 1445 604C1419 562 1366 576 1351 615C1307 606 1293 644 1279 678C1234 690 1228 747 1196 768V1024H1536Z" fill="url(#cloud)" opacity=".75"/>
<path d="M1536 743C1487 709 1465 745 1433 725C1398 696 1356 729 1353 771C1314 791 1325 830 1270 855V1024H1536Z" fill="#210b68" opacity=".55"/>
<!-- Wordmark -->
<text x="768" y="758" text-anchor="middle" font-family="Montserrat,Poppins,Arial,sans-serif" font-size="144" font-weight="500" letter-spacing="17" fill="url(#word)">NOVA</text>
<path d="M350 807H474M1062 807H1186" stroke="url(#blueText)" stroke-width="3" stroke-linecap="round"/>
<text x="768" y="824" text-anchor="middle" font-family="Montserrat,Poppins,Arial,sans-serif" font-size="40" font-weight="500" letter-spacing="24" fill="url(#blueText)">BROWSER</text>
<rect x="408" y="862" width="720" height="82" rx="41" fill="url(#pill)" stroke="#7447ff" stroke-width="2" filter="url(#soft)"/>
<rect x="410" y="864" width="716" height="78" rx="39" fill="none" stroke="#a58aff" opacity=".5"/>
<path d="M483 887l7 13 13 7-13 7-7 13-7-13-13-7 13-7zM1053 887l7 13 13 7-13 7-7 13-7-13-13-7 13-7z" fill="#fff" filter="url(#soft)"/>
<text x="768" y="920" text-anchor="middle" font-family="Montserrat,Poppins,Arial,sans-serif" font-size="36" font-style="italic" letter-spacing="8" fill="#aaa5ff">Browse Beyond</text>
</svg>