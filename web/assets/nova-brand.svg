<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">NOVA Browser — Browse Beyond</title>
<desc id="desc">A luminous cyan and violet NOVA ribbon, surrounded by a glowing orbital ring, crown and cursor on a midnight starfield.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#020717"/><stop offset=".55" stop-color="#04091e"/><stop offset="1" stop-color="#01030d"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#183dff" stop-opacity=".45"/><stop offset=".55" stop-color="#1528a7" stop-opacity=".16"/><stop offset="1" stop-color="#020718" stop-opacity="0"/></radialGradient>
 <linearGradient id="n" x1=".08" y1="0" x2=".94" y2="1"><stop stop-color="#67edff"/><stop offset=".27" stop-color="#28baff"/><stop offset=".52" stop-color="#3158ff"/><stop offset=".76" stop-color="#782cff"/><stop offset="1" stop-color="#20cfff"/></linearGradient>
 <linearGradient id="orbit" x1=".08" y1=".8" x2=".95" y2=".12"><stop stop-color="#f4a0ff"/><stop offset=".3" stop-color="#914bff"/><stop offset=".57" stop-color="#4869ff"/><stop offset=".82" stop-color="#53e8ff"/><stop offset="1" stop-color="#a3f8ff"/></linearGradient>
 <linearGradient id="crown" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".53" stop-color="#d9d5ff"/><stop offset="1" stop-color="#a65aff"/></linearGradient>
 <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".75" stop-color="#e5ebff"/><stop offset="1" stop-color="#9bb4ff"/></linearGradient>
 <linearGradient id="blueText"><stop stop-color="#3e9bff"/><stop offset=".5" stop-color="#8054ff"/><stop offset="1" stop-color="#36c9ff"/></linearGradient>
 <linearGradient id="cloud" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#713cff" stop-opacity=".74"/><stop offset="1" stop-color="#160a58" stop-opacity=".05"/></linearGradient>
 <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151642" stop-opacity=".95"/><stop offset="1" stop-color="#100b36" stop-opacity=".85"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<ellipse cx="768" cy="420" rx="640" ry="430" fill="url(#halo)"/>
<g fill="#d9f5ff"><circle cx="180" cy="165" r="2"/><circle cx="388" cy="120" r="1.6"/><circle cx="566" cy="91" r="2"/><circle cx="976" cy="88" r="1.5"/><circle cx="1155" cy="147" r="1.5"/><circle cx="1287" cy="328" r="1.8"/><circle cx="1390" cy="224" r="1.3"/><circle cx="369" cy="422" r="1.5"/><circle cx="220" cy="670" r="1.6"/><circle cx="1320" cy="715" r="1.3"/></g>
<g stroke="#b9eaff" stroke-width="2" opacity=".9" filter="url(#soft)"><path d="M565 78v35M547 95h36M385 395v29M370 409h30M1133 431v50M1108 456h50M977 77v22M966 88h22M1285 316v22M1274 327h22"/></g>
<ellipse cx="768" cy="393" rx="548" ry="280" fill="none" stroke="#234bff" stroke-width="5" opacity=".16" filter="url(#glow)"/>
<ellipse cx="768" cy="393" rx="548" ry="280" fill="none" stroke="url(#orbit)" stroke-width="3" opacity=".6"/>
<!-- Ribbon N -->
