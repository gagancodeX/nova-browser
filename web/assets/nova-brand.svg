<path d="M475 583L542 290C553 239 592 218 639 232L692 247C718 255 739 270 759 293L895 454L876 568L728 393C704 365 679 337 649 304C628 281 605 267 585 276C573 282 568 297 564 314L505 578Z" fill="url(#n)"/>
<path d="M893 456L873 271C869 241 888 224 920 224H986C1018 224 1032 242 1028 272L1001 542C995 592 962 614 922 605C897 600 879 582 864 558L821 490L878 435Z" fill="url(#n)" filter="url(#soft)"/>
<path d="M564 276C607 251 635 282 665 316L896 454" fill="none" stroke="#a8f7ff" stroke-width="5" opacity=".35"/>
