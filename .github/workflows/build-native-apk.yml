name: Build Android TV Browser APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      BROWSER_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
      BROWSER_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
      BROWSER_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      BROWSER_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile development APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Package development APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Android-TV-Browser-${{ steps.version.outputs.version }}-debug.apk"
          sha256sum "Android-TV-Browser-${{ steps.version.outputs.version }}-debug.apk" > "Android-TV-Browser-${{ steps.version.outputs.version }}-debug.sha256"

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Browser-${{ steps.version.outputs.version }}-debug
          path: |
            Android-TV-Browser-${{ steps.version.outputs.version }}-debug.apk
            Android-TV-Browser-${{ steps.version.outputs.version }}-debug.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Decode stable signing key (optional)
        if: ${{ env.BROWSER_KEYSTORE_BASE64 != '' && env.BROWSER_KEYSTORE_PASSWORD != '' && env.BROWSER_KEY_ALIAS != '' && env.BROWSER_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$BROWSER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/browser-release.jks"
          test -s "$RUNNER_TEMP/browser-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/browser-release.jks" -storepass "$BROWSER_KEYSTORE_PASSWORD" -alias "$BROWSER_KEY_ALIAS" >/dev/null
          echo "NOVA_KEYSTORE_PATH=$RUNNER_TEMP/browser-release.jks" >> "$GITHUB_ENV"
          echo "NOVA_KEYSTORE_PASSWORD=$BROWSER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOVA_KEY_ALIAS=$BROWSER_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOVA_KEY_PASSWORD=$BROWSER_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build stable-signed release APK
        if: ${{ env.NOVA_KEYSTORE_PATH != '' }}
        run: gradle --no-daemon -p android assembleRelease

      - name: Package stable-signed release
        if: ${{ env.NOVA_KEYSTORE_PATH != '' }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Android-TV-Browser-${{ steps.version.outputs.version }}.apk"
          sha256sum "Android-TV-Browser-${{ steps.version.outputs.version }}.apk" > "Android-TV-Browser-${{ steps.version.outputs.version }}.sha256"
          cp "Android-TV-Browser-${{ steps.version.outputs.version }}.apk" Android-TV-Browser.apk
          sha256sum Android-TV-Browser.apk > Android-TV-Browser.apk.sha256

      - name: Upload stable-signed APK
        if: ${{ env.NOVA_KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Browser-${{ steps.version.outputs.version }}-release
          path: |
            Android-TV-Browser-${{ steps.version.outputs.version }}.apk
            Android-TV-Browser-${{ steps.version.outputs.version }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable GitHub Release
        if: ${{ env.NOVA_KEYSTORE_PATH != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Android TV Browser v${{ steps.version.outputs.version }}
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: |
            Android-TV-Browser.apk
            Android-TV-Browser.apk.sha256
          body: |
            Stable-signed Android TV browser APK.

            Download Android-TV-Browser.apk for installation.
            In-app updates are available when the installed package has the same signing certificate.
            Verify the download using Android-TV-Browser.apk.sha256.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain release signing status
        if: ${{ env.NOVA_KEYSTORE_PATH == '' }}
        run: |
          echo "::notice::Debug APK is available as an Actions artifact."
          echo "::notice::Stable-signed release skipped. Add the four repository signing secrets to enable in-app updates."
