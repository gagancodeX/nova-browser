name: Build NOVA Android TV APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Rename APK and generate checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NOVA-TV-Browser-1.4.2.apk
          sha256sum NOVA-TV-Browser-1.4.2.apk > NOVA-TV-Browser-1.4.2.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TV-Browser-1.4.2
          path: |
            NOVA-TV-Browser-1.4.2.apk
            NOVA-TV-Browser-1.4.2.sha256
          if-no-files-found: error
          retention-days: 30
