plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gagan.nova'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gagan.nova'
        minSdk 23
        targetSdk 28
        versionCode 7
        versionName '1.4.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
