plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gagan.nova'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gagan.nova'
        minSdk 23
        targetSdk 28
        versionCode 14
        versionName '1.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def keyPath = System.getenv("NOVA_KEYSTORE_PATH")
            if (keyPath != null && !keyPath.trim().isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv("NOVA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NOVA_KEY_ALIAS")
                keyPassword System.getenv("NOVA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            if (System.getenv("NOVA_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
